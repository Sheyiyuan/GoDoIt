name: Build and Release

"on":
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ (github.ref_type == 'tag' && github.event_name != 'workflow_dispatch') && github.ref || 'development' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' || github.event_name == 'workflow_dispatch' }}

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '10.14.0'
  WAILS_VERSION: 'v2.11.0'

jobs:
  quality:
    name: Quality and release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      commit: ${{ steps.metadata.outputs.commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive and validate release identity
        id: metadata
        run: scripts/derive-version.sh

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        env:
          GOFLAGS: -tags=webkit2_41
        run: make check

  build-linux:
    name: Build Linux amd64
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run native tests and vet
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          pnpm --dir gui/frontend run check
          pnpm --dir gui/frontend run build
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build and validate archive
        run: >-
          make package-linux
          RELEASE_VERSION='${{ needs.quality.outputs.version }}'
          RELEASE_COMMIT='${{ needs.quality.outputs.commit }}'
          RELEASE_BUILD_DATE='${{ needs.quality.outputs.build_date }}'
          SOURCE_DATE_EPOCH='${{ needs.quality.outputs.source_date_epoch }}'

      - name: Build Linux installers
        run: scripts/package-linux-installers.sh '${{ needs.quality.outputs.version }}' "$GITHUB_WORKSPACE/build/release/linux_amd64" dist

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.run_id }}
          path: |
            dist/GoDoIt_${{ needs.quality.outputs.version }}_linux_amd64.tar.gz
            dist/GoDoIt_${{ needs.quality.outputs.version }}_linux_amd64.deb
            dist/GoDoIt_${{ needs.quality.outputs.version }}_linux_amd64.rpm
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS arm64
    needs: quality
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Run native tests and vet
        run: |
          pnpm --dir gui/frontend run check
          pnpm --dir gui/frontend run build
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build, sign, and validate archive
        run: >-
          make package-macos
          RELEASE_VERSION='${{ needs.quality.outputs.version }}'
          RELEASE_COMMIT='${{ needs.quality.outputs.commit }}'
          RELEASE_BUILD_DATE='${{ needs.quality.outputs.build_date }}'
          SOURCE_DATE_EPOCH='${{ needs.quality.outputs.source_date_epoch }}'

      - name: Build macOS disk image
        run: scripts/package-macos-dmg.sh '${{ needs.quality.outputs.version }}' build/release/darwin_arm64/project/gui/build/bin/GoDoIt.app dist

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ github.run_id }}
          path: |
            dist/GoDoIt_${{ needs.quality.outputs.version }}_darwin_arm64.zip
            dist/GoDoIt_${{ needs.quality.outputs.version }}_darwin_arm64.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows amd64
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install native tooling
        shell: pwsh
        run: |
          choco install make nsis --no-progress -y
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Verify AMD64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Run native tests and vet
        shell: pwsh
        run: |
          pnpm --dir gui/frontend run check
          pnpm --dir gui/frontend run build
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build and validate archive
        shell: bash
        run: >-
          make package-windows
          RELEASE_VERSION='${{ needs.quality.outputs.version }}'
          RELEASE_COMMIT='${{ needs.quality.outputs.commit }}'
          RELEASE_BUILD_DATE='${{ needs.quality.outputs.build_date }}'
          SOURCE_DATE_EPOCH='${{ needs.quality.outputs.source_date_epoch }}'

      - name: Verify Windows version resource
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          $actual = (Get-Item build/release/windows_amd64/project/gui/build/bin/gdit-gui.exe).VersionInfo.ProductVersion
          if ($actual -ne $env:EXPECTED_VERSION) {
            throw "GUI ProductVersion $actual does not match $env:EXPECTED_VERSION"
          }

      - name: Build Windows installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows-installer.ps1 -Version '${{ needs.quality.outputs.version }}' -Root "$env:GITHUB_WORKSPACE\build\release\windows_amd64" -Output "$env:GITHUB_WORKSPACE\dist"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.run_id }}
          path: |
            dist/GoDoIt_${{ needs.quality.outputs.version }}_windows_amd64.zip
            dist/GoDoIt_${{ needs.quality.outputs.version }}_windows_amd64_setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish GitHub Release
    needs: [quality, build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Download verified platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        run: |
          go run ./core/cmd/gdit-release checksums --dir release-assets --version '${{ needs.quality.outputs.version }}'
          go run ./core/cmd/gdit-release verify-final --root . --dir release-assets --version '${{ needs.quality.outputs.version }}'

      - name: Reject an existing stable Release
        if: ${{ needs.quality.outputs.channel == 'stable' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ needs.quality.outputs.tag }}',
              });
              core.setFailed('stable Release already exists and is immutable');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Replace previous development Release
        if: ${{ needs.quality.outputs.channel == 'development' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'dev-latest' });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'tags/dev-latest' });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }

      - name: Publish stable Release
        if: ${{ needs.quality.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
          RELEASE_NAME: ${{ needs.quality.outputs.release_name }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.tar.gz" \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.deb" \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.rpm" \
            "release-assets/GoDoIt_${VERSION}_darwin_arm64.zip" \
            "release-assets/GoDoIt_${VERSION}_darwin_arm64.dmg" \
            "release-assets/GoDoIt_${VERSION}_windows_amd64.zip" \
            "release-assets/GoDoIt_${VERSION}_windows_amd64_setup.exe" \
            "release-assets/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_NAME"

      - name: Publish development Release
        if: ${{ needs.quality.outputs.channel == 'development' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.quality.outputs.release_name }}
          VERSION: ${{ needs.quality.outputs.version }}
          COMMIT: ${{ needs.quality.outputs.commit }}
        run: |
          gh release create dev-latest \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.tar.gz" \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.deb" \
            "release-assets/GoDoIt_${VERSION}_linux_amd64.rpm" \
            "release-assets/GoDoIt_${VERSION}_darwin_arm64.zip" \
            "release-assets/GoDoIt_${VERSION}_darwin_arm64.dmg" \
            "release-assets/GoDoIt_${VERSION}_windows_amd64.zip" \
            "release-assets/GoDoIt_${VERSION}_windows_amd64_setup.exe" \
            "release-assets/SHA256SUMS" \
            --prerelease \
            --target "$COMMIT" \
            --title "$RELEASE_NAME" \
            --notes "Rolling development build from commit $COMMIT. This build is not notarized."
