name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimum-go:
    name: Go 1.25.13 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum

      - name: Run format, tests, and vet
        run: make check

      - name: Build Linux CLI
        run: make build

  go:
    name: Go 1.26 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum

      - name: Run format, tests, and vet
        run: make check

      - name: Run race detector
        run: make test-race

      - name: Check core vulnerabilities
        working-directory: core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check CLI vulnerabilities
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build Linux CLI
        run: make build

  darwin:
    name: macOS arm64 checks
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Run native tests
        run: go test ./core/... ./cli/...

      - name: Run vet
        run: go vet ./core/... ./cli/...

      - name: Build macOS CLI
        run: go build -trimpath -o gdit-darwin-arm64 ./cli/cmd/gdit

  windows:
    name: Windows amd64 checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum

      - name: Verify AMD64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Run native tests
        run: go test ./core/... ./cli/...

      - name: Run vet
        run: go vet ./core/... ./cli/...

      - name: Build Windows CLI
        run: go build -trimpath -o gdit-windows-amd64.exe ./cli/cmd/gdit
