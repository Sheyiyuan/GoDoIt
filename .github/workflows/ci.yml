name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '10.14.0'
  WAILS_VERSION: 'v2.11.0'

jobs:
  minimum-go:
    name: Go 1.25.13 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up minimum supported Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Run minimum-version quality gate
        env:
          GOFLAGS: -tags=webkit2_41
        run: make check

  go:
    name: Go 1.26 checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        env:
          GOFLAGS: -tags=webkit2_41
        run: make check

      - name: Run race detector
        env:
          GOFLAGS: -tags=webkit2_41
        run: make test-race

      - name: Check core vulnerabilities
        working-directory: core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check CLI vulnerabilities
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check GUI vulnerabilities
        env:
          GOFLAGS: -tags=webkit2_41
        working-directory: gui
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  linux:
    name: Linux amd64 GUI and package
    needs: [minimum-go, go]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run native GUI tests and vet
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          pnpm --dir gui/frontend run check
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build and validate Linux archive
        run: make package-linux

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: godoit-linux-${{ github.sha }}
          path: dist/GoDoIt_*_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  darwin:
    name: macOS arm64 GUI and package
    needs: [minimum-go, go]
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Run native GUI tests and vet
        run: |
          pnpm --dir gui/frontend run check
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build, sign, and validate macOS archive
        run: make package-macos

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: godoit-darwin-${{ github.sha }}
          path: dist/GoDoIt_*_darwin_arm64.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows amd64 GUI and package
    needs: [minimum-go, go]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            cli/go.sum
            gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: pnpm install --frozen-lockfile

      - name: Install native tooling
        shell: pwsh
        run: |
          choco install make --no-progress -y
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Verify AMD64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Run native GUI tests and vet
        shell: pwsh
        run: |
          pnpm --dir gui/frontend run check
          go test ./core/... ./cli/... ./gui/...
          go vet ./core/... ./cli/... ./gui/...

      - name: Build and validate Windows archive
        shell: bash
        run: make package-windows

      - name: Verify Windows version resource
        shell: pwsh
        run: |
          $expected = bash ./scripts/derive-version.sh version
          $actual = (Get-Item build/release/windows_amd64/project/gui/build/bin/gdit-gui.exe).VersionInfo.ProductVersion
          if ($actual -ne $expected) {
            throw "GUI ProductVersion $actual does not match $expected"
          }

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: godoit-windows-${{ github.sha }}
          path: dist/GoDoIt_*_windows_amd64.zip
          if-no-files-found: error
          retention-days: 7
